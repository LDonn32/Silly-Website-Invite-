<!DOCTYPE html>
<html>
<head>
    <title>You're Invited 😎</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #ffe6f2; /* soft pink */
            padding: 40px;
            overflow-x: hidden;
        }

        /* Floating balloons */
        .balloon {
            position: absolute;
            bottom: -150px;
            width: 80px;
            animation: floatUp 10s linear infinite;
            opacity: 0.9;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); }
            100% { transform: translateY(-120vh) rotate(10deg); }
        }

        /* Sparkle animation for random meme */
        @keyframes sparkle {
            0% { box-shadow: 0 0 10px #ff99cc; }
            50% { box-shadow: 0 0 25px #ff4da6; }
            100% { box-shadow: 0 0 10px #ff99cc; }
        }

        /* Static image (always shown) */
        #mainImage {
            width: 350px;
            border-radius: 15px;
            border: 6px solid #ff66b3;
            margin-bottom: 25px;
        }

        /* Random meme */
        #meme {
            width: 320px;
            border-radius: 15px;
            margin-top: 20px;
            border: 6px solid #ff66b3;
            animation: sparkle 2s infinite ease-in-out;
        }

        h1 {
            color: #cc0066;
            font-size: 40px;
            margin-bottom: 10px;
        }

        button {
            padding: 15px 25px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        #yesBtn {
            background: #ff4da6;
            color: white;
        }

        #yesBtn:hover {
            background: #e60073;
        }

        #noBtn {
            background: #ff99cc;
            color: white;
            position: absolute;
        }

        #response {
            margin-top: 20px;
            font-size: 22px;
            font-weight: bold;
            color: #cc0066;
        }
    </style>
</head>
<body>

    <!-- Floating balloons -->
    <img src="https://i.imgur.com/7yUvePI.png" class="balloon" style="left: 10%; animation-delay: 0s;">
    <img src="https://i.imgur.com/7yUvePI.png" class="balloon" style="left: 40%; animation-delay: 3s;">
    <img src="https://i.imgur.com/7yUvePI.png" class="balloon" style="left: 70%; animation-delay: 6s;">

    <h1>YOU'RE INVITED 🎀</h1>

    <!-- Static image you uploaded -->
    <img id="mainImage" src="/static/img/your-image.jpeg" alt="Birthday Image">

    <h2 style="color:#cc0066;">Laura's 30th Birthday Party 🎉</h2>

    <p><strong>Location:</strong> Rody Boland's in Rathmines🍺</p>
    <p><strong>Time:</strong> Saturday 11th of July @ 8pm</p>

    <!-- Random meme below static image -->
    <img id="meme" src="" alt="random meme">

    <div style="margin-top: 30px;">
        <button id="yesBtn" onclick="sayYes()">Yes I'm Coming</button>
        <button id="noBtn" onmouseover="runAway()">No</button>
    </div>

    <div id="response"></div>

    <!-- Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script>
        // RANDOM 30TH BIRTHDAY MEMES
        const memes = [
            "https://hipinvites.com/wp-content/uploads/2021/10/30th-Birthday-Meme-29-730x409.jpg",
            "https://tse1.mm.bing.net/th/id/OIP.b8D6sSd44hBGdUk087L_zgHaFM.jpg",
            "https://i.pinimg.com/originals/75/fc/83/75fc8338b33169ddbd1e198c87c3e1f2.jpg",
            "https://www.scribbler.com/cdn/shop/files/SSCR05.jpg",
            "https://tse2.mm.bing.net/th/id/OIP.6OyuYc-wJxp56ho0Sl9iVgHaKT.jpg"
        ];

        // Pick a random meme on page load
        document.getElementById("meme").src =
            memes[Math.floor(Math.random() * memes.length)];

        // YES BUTTON → fetch funny response + confetti
        function sayYes() {
            fetch("/rsvp")
                .then(res => res.json())
                .then(data => {
                    document.getElementById("response").innerText = data.message;

                    confetti({
                        particleCount: 200,
                        spread: 70,
                        origin: { y: 0.6 }
                    });
                });
        }

        // NO BUTTON → runs away from mouse
        function runAway() {
            const btn = document.getElementById("noBtn");
            const x = Math.random() * (window.innerWidth - 100);
            const y = Math.random() * (window.innerHeight - 50);
            btn.style.left = x + "px";
            btn.style.top = y + "px";
        }
    </script>

</body>
</html>
